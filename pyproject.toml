[build-system]
requires = ["setuptools>=80", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "photo-curator-google-helper"
version = "0.1.0"
description = "Private Google Photos helper bundled with Photo Curator"
requires-python = ">=3.10,<3.14"
dependencies = ["requests>=2.32,<3"]

[dependency-groups]
dev = ["pyinstaller>=6.14,<7", "pytest>=8.4,<9"]

[tool.setuptools.packages.find]
where = ["GooglePhotosHelper"]

[tool.pytest.ini_options]
testpaths = ["GooglePhotosHelper/tests"]
pythonpath = ["GooglePhotosHelper"]

[tool.ruff]
line-length = 100
